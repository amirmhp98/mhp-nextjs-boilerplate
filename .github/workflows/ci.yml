name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:all
      - run: npm run test:coverage
      - run: npm run test
        env:
          NEXT_PUBLIC_LOCALE: en
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      # The boilerplate keeps both languages; a project has one (setup.sh --locale).
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NEXT_PUBLIC_LOCALE: en

  e2e:
    name: End-to-end (${{ matrix.locale }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        locale: [fa, en]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      NEXT_PUBLIC_LOCALE: ${{ matrix.locale }}
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.locale }}
          path: playwright-report
          retention-days: 7

  setup-smoke:
    name: setup.sh (${{ matrix.locale }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        locale: [fa, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # What an adopter does: run setup.sh on a clone, then work in one language.
      - name: Run setup.sh on a copy
        run: |
          mkdir -p /tmp/smoke
          git archive HEAD | tar -x -C /tmp/smoke
          cd /tmp/smoke
          ./setup.sh smoke-${{ matrix.locale }} --locale ${{ matrix.locale }}
          test ! -f src/messages/$([ "${{ matrix.locale }}" = fa ] && echo en || echo fa).ts
          ! grep -rq 'fa-only' AGENTS.md src/app/globals.css
          if [ "${{ matrix.locale }}" = en ]; then
            test ! -d src/app/fonts && test ! -f scripts/rtl-smoke-check.mjs
            ! grep -q 'lint:rtl' package.json
          else
            test -f src/app/fonts/YekanBakh-VF.woff2 && grep -q 'lint:rtl' package.json
          fi
      - name: Verify the generated project
        working-directory: /tmp/smoke
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: |
          npm run lint:all
          npm run test
          npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=app postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name web --network ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@db:5432/app?schema=public \
            -e NODE_ENV=production app:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs web; exit 1
